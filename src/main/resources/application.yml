spring:
  ai:
    dashscope:
      api-key: [your api-key(阿里云百炼)]
      model: deepseek-v4-pro
      temperature: 0.3
      max-tokens: 2048

  application:
    name: recruitment-agent

  # MySQL 数据源 & JPA 配置
  datasource:
    url: jdbc:mysql://localhost:3306/recruitmind?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&createDatabaseIfNotExist=true
    username: [your username]
    password: [your password]
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

server:
  port: 8080

management:
  tracing:
    enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  prometheus:
    metrics:
      export:
        enabled: true

# 样例数据启动运行器开关（设为 true 则在启动时自动分析 3 份样例材料）
app:
  sample-runner:
    enabled: false

logging:
  level:
    com.example.recruitmentagent: DEBUG
    com.alibaba.cloud.ai: DEBUG
  file:
    path: ./logs
    name: ./logs/recruitment-agent.log
